name: Build FFFF

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Branch
        default: "main"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API: 31
      NDK_URL: https://dl.google.com/android/repository/android-ndk-r27d-linux.zip

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: 663388p000/FFFF
          ref: ${{ github.event.inputs.BRANCH }}
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            wget \
            make \
            git \
            vulkan-tools \
            libvulkan1 \
            libvulkan-dev \
            glslang-tools \
            spirv-tools \
            spirv-headers \
            libclang-dev \
            libelf-dev \
            llvm-dev

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force

      - name: Download Android NDK r27d
        run: |
          wget -q "$NDK_URL" -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r26d" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build Shaders
        env:
          CC: aarch64-linux-android31-clang
          CXX: aarch64-linux-android31-clang++
        run: |
          make shaders

      - name: Build
        env:
          CC: aarch64-linux-android31-clang
          CXX: aarch64-linux-android31-clang++
          AR: llvm-ar
          STRIP: llvm-strip
        run: |
          make -j$(nproc)

      - name: Strip Libraries
        run: |
          find . -name "*.so" -exec llvm-strip --strip-unneeded {} \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFFF-arm64-v8a
          path: |
            **/*.so
