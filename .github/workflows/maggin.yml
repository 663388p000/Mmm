name: Build FSR1 Mali Hook

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r26d
  API_LEVEL: 30

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip make glslang-tools xxd

      - name: Download Android NDK
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API_LEVEL}-clang" --version
          glslangValidator --version
          xxd --version

      # کامپایل شیدرها (فاز ۱)
      - name: Compile shaders (GLSL → SPIR-V → C headers)
        run: make -j"$(nproc)" shaders API=${{ env.API_LEVEL }}

      # کامپایل کتابخونه (فاز ۲)
      - name: Build vulkan.fsr1.so
        run: make -j"$(nproc)" API=${{ env.API_LEVEL }}

      - name: Show build info
        run: make info

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan.fsr1.so
          path: vulkan.fsr1.so
          if-no-files-found: error

      - name: Upload SPIR-V artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaders-spv
          path: |
            shaders/*.spv
            shaders/generated/*.h
          if-no-files-found: warn
