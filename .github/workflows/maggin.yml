name: Build FSR1 Mali Hook

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  # نسخه‌ای که قبلاً تست شده و کار می‌کنه
  NDK_VERSION: r26d
  API_LEVEL: 31

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # فقط چیزی که واقعاً لازمه:
      #   glslangValidator → کامپایل GLSL به SPIR-V
      #   xxd              → تبدیل SPIR-V باینری به C header
      # (vulkan-tools/libvulkan-dev/spirv-tools و... لازم نیستن،
      #  چون cross-compile می‌کنیم و vulkan.h از خود NDK sysroot میاد)
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip make glslang-tools xxd 

      - name: Download Android NDK
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip" -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API_LEVEL}-clang" --version
          glslangValidator --version

      # مرحله‌ی جدا فقط برای خوانایی لاگ (shaders هم prerequisite
      # خودِ target اصلیه، پس این مرحله تکراری نیست، فقط دو تا
      # فاز رو واضح از هم جدا می‌کنه: کامپایل شیدر / کامپایل C)
      - name: Compile shaders (GLSL → SPIR-V → embedded headers)
        run: make shaders API=${{ env.API_LEVEL }}

      - name: Build vulkan.fsr1.so
        run: make -j"$(nproc)" API=${{ env.API_LEVEL }}

      - name: Show build info
        run: make info

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan.fsr1.so
          path: vulkan.fsr1.so
          if-no-files-found: error

      # آرتیفکت دیباگ: خود فایل‌های .spv و header های generated
      # (مفیده اگه بخوایم مستقل shader ها رو با spirv-dis بررسی کنیم)
      - name: Upload SPIR-V artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaders-spv
          path: |
            shaders/*.spv
            shaders/generated/*.h
          if-no-files-found: warn
