name: Build FSR1 Mali Hook

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r26d
  API_LEVEL: 31

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            make \
            glslang-tools \
            vim-common

      - name: Download Android NDK
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          aarch64-linux-android${API_LEVEL}-clang --version
          glslangValidator --version

      - name: Verify Makefile
        run: |
          pwd
          ls -la
          grep -n "^shaders:" Makefile || true

      - name: Compile shaders
        env:
          CC: aarch64-linux-android31-clang
          CXX: aarch64-linux-android31-clang++
        run: |
          make shaders 

      - name: Build
        env:
          CC: aarch64-linux-android31-clang
          CXX: aarch64-linux-android31-clang++
        run: |
          make -j"$(nproc)" API=31

      - name: Show build info
        run: |
          make info

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: vulkan.fsr1.so
          path: vulkan.fsr1.so
          if-no-files-found: error

      - name: Upload SPIR-V
        uses: actions/upload-artifact@v4
        with:
          name: shaders-spv
          path: |
            shaders/*.spv
            shaders/generated/*.h
          if-no-files-found: warn
