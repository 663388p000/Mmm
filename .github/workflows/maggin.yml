name: Build FSR1 Mali Hook

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  NDK_VERSION: r26d
  API_LEVEL: 30

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip make glslang-tools xxd git

      - name: Download Android NDK
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Clone FSR1 source
        run: |
          git clone --depth 1 https://github.com/663388p000/FFFF.git fsr1-source
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/fsr1-source" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          echo "Project: $PROJECT_DIR"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${API_LEVEL}-clang" --version
          glslangValidator --version
          xxd --version

      - name: Compile shaders
        working-directory: ${{ env.PROJECT_DIR }}
        run: make -j"$(nproc)" shaders API=${{ env.API_LEVEL }}

      - name: Build vulkan.fsr1.so
        working-directory: ${{ env.PROJECT_DIR }}
        run: make -j"$(nproc)" API=${{ env.API_LEVEL }}

      - name: Show build info
        working-directory: ${{ env.PROJECT_DIR }}
        run: make info

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan.fsr1.so
          path: ${{ env.PROJECT_DIR }}/vulkan.fsr1.so
          if-no-files-found: error

      - name: Upload SPIR-V artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaders-spv
          path: |
            ${{ env.PROJECT_DIR }}/shaders/*.spv
            ${{ env.PROJECT_DIR }}/shaders/generated/*.h
          if-no-files-found: warn
